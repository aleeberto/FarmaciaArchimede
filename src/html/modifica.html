<!DOCTYPE html>
<html lang="it">
<component>head</component>
<body class="no-print">

<component>header</component>

<nav aria-label="breadcrumb" class="breadcrumb">
    Ti trovi in:
    <ol>
        <li><a href="/index.php" lang="it">Prodotti</a></li>
        <li aria-current="page">Modifica</li>
    </ol>
</nav>

<main>
    <h1>Modifica</h1>

    <div class="main-content">
        <form id="product-form" class="product-form" method="post" action="/products/save" enctype="multipart/form-data" novalidate>
            <!-- ID nascosto -->
            <input type="hidden" id="product-id" name="product_id"
                   value="{{product_id}}">

            <!-- Select tipo prodotto -->
            <div class="form-control">
                <label for="product-type" class="form-label">Tipo prodotto<span>*</span></label>
                <select id="product-type" name="product_type_id" required>
                    <option value="" disabled>Seleziona un tipo</option>
                    {{product_type_options}}
                </select>
            </div>

            <!-- Nome breve -->
            <input type="text" id="product-short-name" name="short_name" required
                   maxlength="128" value="{{short_name}}">

            <!-- Nome completo -->
            <input type="text" id="product-name" name="name" required
                   maxlength="128" value="{{name}}">

            <!-- Produttore -->
            <input type="text" id="product-manufacturer" name="manufacturer" required
                   maxlength="100" value="{{manufacturer}}">

            <!-- Codice AIC -->
            <input type="text" id="product-aic" name="aic_code" required
                   maxlength="10" pattern="[A-Z0-9]{10}"
                   value="{{aic_code}}">

            <!-- Formato -->
            <select id="product-format" name="format" required>
                <option value="" disabled>Seleziona formato</option>
                <?php foreach (['compresse','capsule','sciroppo',/*…*/] as $fmt): ?>
                <option value="<?= $fmt?>"
                <?= $fmt === '{{format}}' ? ' selected' : ''?>>
                <?= ucfirst($fmt)?>
                </option>
                <?php endforeach; ?>
            </select>

            <!-- Prezzo -->
            <input type="number" id="product-price" name="price"
                   step="0.01" min="0.01" required
                   value="{{price}}">

            <!-- Disponibilità -->
            <input type="number" id="product-availability" name="availability"
                   min="0" required value="{{availability}}">

            <!-- Descrizione -->
            <textarea id="product-description" name="description"
                      rows="4">{{description}}</textarea>

            <!-- Anteprima immagine (solo se esiste) -->

            <div><img src="{{image_url}}" alt="Anteprima prodotto" style="max-width:150px"></div>

            <input type="file" id="product-image" name="image_file" accept="image/*">

            <!-- Pulsanti -->
            <button type="submit">Salva</button>
            <button type="reset">Annulla</button>
        </form>

    </div>
</main>

<component>footer</component>

</body>
</html>
