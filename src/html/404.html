<!DOCTYPE html>
<html lang="it">

<body class="no-print">
{{ header }}
<main class="error-page main-content" role="main" aria-labelledby="error-title">
    <h1 id="error-title" class="visually-hidden">Errore 404 – Pagina non trovata</h1>

    <p class="eyebrow">Errore 404</p>

    <p class="error-message" aria-live="polite">

        Potrebbe essere stata rimossa, rinominata o non esistere più.
    </p>

    <div class="error-actions">
        <a class="btn-home" href="index.php">Torna alla home</a>
    </div>
</main>
{{ footer }}
