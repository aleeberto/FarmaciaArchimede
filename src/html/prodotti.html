<!DOCTYPE html>
<html lang="it">
{{ head }}
<body class="no-print products">

{{ header }}

<nav aria-label="breadcrumb" class="breadcrumb">
    Ti trovi in:
    <ol>
        <li>
            <a href="/index.php" lang="it">Home</a>
            <span class="separator" aria-hidden="true">&gt;&gt;</span>
        </li>

        <li aria-current="page">Prodotti</li>
    </ol>
</nav>

<main id="main-content">
    <h1>Prodotti</h1>

    <div class="main-content">
        {{ alert }}

        <a href="#results-container" class="skip-link">Salta ai prodotti</a>

        <!-- FORM FILTRI DINAMICO -->
        <form id="filterForm" action="/prodotti.php" method="get">
            <div id="filter-container" class="flex-container">
                <h2>Filtri</h2>

                <div id="search-box">
                    <label for="search">Cerca:</label>
                    <input id="search" type="text" name="search" placeholder="Cerca..." value="" />
                </div>

                <div id="filters">
                    <div class="filter-group">
                        <label for="tipologia">Tipologia:</label>
                        <select name="tipologia" id="tipologia">
                            {{ typeOptions }}
                        </select>
                    </div>

                    <fieldset>
                        <legend>Disponibilità:</legend>

                        <div class="radio">
                            <input type="radio" id="disp-tutti" name="disponibilita" value="tutti" checked />
                            <label for="disp-tutti">Tutti</label>
                        </div>

                        <div class="radio">
                            <input type="radio" id="disp-si" name="disponibilita" value="disponibile" />
                            <label for="disp-si">Disponibile</label>
                        </div>

                        <div class="radio">
                            <input type="radio" id="disp-no" name="disponibilita" value="esaurito" />
                            <label for="disp-no">Esaurito</label>
                        </div>
                    </fieldset>

                </div>
                <input type="submit" value="Applica" />
            </div>
        </form>

        <div id="results-container">
            <div class="pagination-info" aria-live="polite">
                {{ info }}
            </div>
            <ul id="prodotti" class="items">
                {{ items }}
            </ul>
            <div id="pagination-container">
                {{ pagination }}
            </div>
        </div>
    </div>
</main>

{{ footer }}
<script src="/js/reload_products.js"></script>
</body>
</html>
