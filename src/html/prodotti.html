<!DOCTYPE html>
<html lang="it">
{{ head }}
<body class="no-print products">

{{ header }}

<nav aria-label="breadcrumb" class="breadcrumb">
    Ti trovi in:
    <ol>
        <li><a href="/index.php" lang="it">Home</a></li>
        <li aria-current="page">Prodotti</li>
    </ol>
</nav>

<main>
    <h1>Prodotti</h1>

    <div class="main-content">
        {{ alert }}

        <a href="#results-container" class="skip-link">Salta ai prodotti</a>

        <!-- FORM FILTRI DINAMICO -->
        <form id="filterForm" action="/prodotti.php" method="get">
            <div id="filter-container" class="flex-container">
                <h2>Filtri</h2>

                <div id="search-box">
                    <input
                            type="text"
                            name="search"
                            placeholder="Cerca..."
                            value="{{ searchQuery }}"
                    >
                </div>

                <div id="filters">
                    <!-- Select tipologia dinamica -->
                    <div class="filter-group">
                        <label for="tipologia">Tipologia:</label>
                        <select name="tipologia" id="tipologia">
                            {{ typeOptions }}
                        </select>
                    </div>

                    <fieldset>
                        <legend>Disponibilità:</legend>
                        <label>
                            <input type="radio" name="disponibilita" value="tutti" {{ checkedTutti }}>
                            Tutti
                        </label><br>
                        <label>
                            <input type="radio" name="disponibilita" value="disponibile" {{ checkedDisponibile }}>
                            Disponibile
                        </label><br>
                        <label>
                            <input type="radio" name="disponibilita" value="esaurito" {{ checkedEsaurito }}>
                            Esaurito
                        </label>
                    </fieldset>
                </div>

                <input type="submit" value="Applica">
            </div>
        </form>

        <div id="results-container">
            <div class="pagination-info">
                {{ info }}
            </div>
            <div id="prodotti" class="items">
                {{ items }}
            </div>
            <div id="pagination-container">
                {{ pagination }}
            </div>
        </div>
    </div>
</main>

{{ footer }}
<script src="/js/reload_products.js"></script>
</body>
</html>
