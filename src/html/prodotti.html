<!DOCTYPE html>
<html lang="it">
<component>head</component>
<body class="no-print">

<component>header</component>

<nav aria-label="breadcrumb" class="breadcrumb">
    Ti trovi in:
    <ol>
        <li><a href="/index.php" lang="it">Home</a></li>
        <li aria-current="page">Prodotti</li>
    </ol>
</nav>

<main>
    <h1>Prodotti</h1>

    <div class="main-content">

        <component>alert</component>

        <!-- FORM FILTRI DINAMICO -->
        <form id="filterForm" action="prodotti.php" method="get">
            <div id="filter-container" class="flex-container">
                <h2>Filtri</h2>

                <div id="search-box">
                    <input
                            type="text"
                            name="search"
                            placeholder="Cerca..."
                            value="<component>searchQuery</component>"
                    >
                </div>

                <div id="filters">
                    <!-- Select tipologia dinamica -->
                    <div class="filter-group">
                        <label for="tipologia">Tipologia:</label>
                        <select name="tipologia" id="tipologia">
                            <component>typeOptions</component>
                        </select>
                    </div>

                    <fieldset>
                        <legend>Disponibilità:</legend>
                        <label>
                            <input type="radio" name="disponibilita" value="tutti" <component>checkedTutti</component>>
                            Tutti
                        </label><br>
                        <label>
                            <input type="radio" name="disponibilita" value="disponibile" <component>checkedDisponibile</component>>
                            Disponibile
                        </label><br>
                        <label>
                            <input type="radio" name="disponibilita" value="esaurito" <component>checkedEsaurito</component>>
                            Esaurito
                        </label>
                    </fieldset>
                </div>

                <input type="submit" value="Applica">
            </div>
        </form>

        <div id="results-container">
            <div class="pagination-info">
                <component>info</component>
            </div>
            <div id="prodotti" class="items">
                <component>items</component>
            </div>
            <div id="pagination-container">
                <component>pagination</component>
            </div>
        </div>
    </div>
</main>

<component>footer</component>
<script src="/js/products.js"></script>
</body>
</html>
