<li id="card-product-{{ id }}"
         class="product-card"
         role="listitem"
         aria-labelledby="prod-title-{{ id }}"
         aria-describedby="prod-meta-{{ id }}">
    <header class="product-card__header">
        <h2 id="prod-title-{{ id }}" class="product-card__title">
            {{ name }}
        </h2>
        <p class="product-card__manufacturer">
            <span class="visually-hidden">Produttore:</span> {{ manufacturer }}
        </p>
        <p id="prod-meta-{{ id }}" class="visually-hidden">
            ID {{ id }}, Prezzo {{ price }} euro, Disponibilità {{ availability }}.
        </p>
    </header>

    <dl class="product-card__details">
        <div class="row">
            <dt>ID</dt><dd>{{ id }}</dd>
        </div>
        <div class="row">
            <dt>Prezzo</dt>
            <dd>
                <data class="price" value="18.89">18.89 €</data>
            </dd>
        </div>
        <div class="row">
            <dt>Disponibilità</dt>
            <dd>
                <span class="badge {{ availability_class }}" aria-live="polite">{{ availability }}</span>
            </dd>
        </div>
    </dl>

    <div class="product-card__actions">
        <a class="btn-edit"
           href="modifica.php?id={{ id }}"
           aria-label="Modifica prodotto: {{ name }} (ID {{ id }})">
            Modifica
        </a>

        <form class="delete-form" action="delete.php" method="post" data-row="#card-product-{{ id }}">
            <input type="hidden" name="csrf_token" value="{{ csrf }}" />
            <input type="hidden" name="type" value="product" />
            <input type="hidden" name="id" value="{{ id }}" />
            <button type="submit" class="btn-delete">
                Elimina
                <span class="visually-hidden">prodotto: {{ name }} (ID {{ id }})</span>
            </button>
        </form>
    </div>
</li>
