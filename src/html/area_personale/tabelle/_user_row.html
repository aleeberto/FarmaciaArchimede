<tr>
    <td>{{ id }}</td>
    <td>{{ first_name }}</td>
    <td>{{ last_name }}</td>
    <td>{{ email }}</td>
    <td>{{ tax_code }}</td>
    <td>{{ role }}</td>
    <td class="actions">
        {{ edit_control }}
        <form method="post" action="/actions/delete_user.php" class="inline-form" onsubmit="return confirm('Eliminare l\'utente #{{ id }}?');">
            <input type="hidden" name="user_id" value="{{ id }}" />
            <input type="hidden" name="csrf_token" value="{{ csrf }}" />
            <button type="submit" class="btn-delete" {{ delete_disabled }}>Elimina</button>
        </form>
    </td>
</tr>
