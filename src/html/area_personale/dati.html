<!DOCTYPE html>
<html lang="it">
<head>
    {{ head }}
</head>
<body class="no-print">
{{ header }}

<main>
    <nav aria-label="breadcrumb" class="breadcrumb">
        Ti trovi in:
        <ol>
            {{ breadcrumb }}
        </ol>
    </nav>

    <h1>I miei dati</h1>
    <ul>
        <li><strong>Nome:</strong> {{ user.first_name }} {{ user.last_name }}</li>
        <li><strong>Email:</strong> {{ user.email }}</li>
        <li><strong>Codice fiscale:</strong> {{ user.tax_code }}</li>
    </ul>
    <button class="edit-button" onclick="location.href='?section=dati&action=edit'">
        Modifica dati
    </button>
    <p><a href="?" class="btn-back">← Torna indietro</a></p>
</main>

{{ footer }}
</body>
</html>
