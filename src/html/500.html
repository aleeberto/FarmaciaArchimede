<!DOCTYPE html>
<html lang="it">
<head>
    {{ head }}
</head>
<body class="no-print">
{{ header }}
<main class="error-page main-content" role="main" aria-labelledby="error-title">
    <h1 id="error-title" class="visually-hidden">Errore 500 – Errore interno del server</h1>
    <p class="eyebrow">Errore 500</p>
    <div class="error-code" aria-hidden="true">500</div>

    <p class="error-message" aria-live="polite">
        Ops! Qualcosa è andato storto sul server.
    </p>
    <p class="error-hint">
        Il nostro team è già al lavoro per risolvere il problema.
    </p>
</main>
{{ footer }}
</body>
</html>
