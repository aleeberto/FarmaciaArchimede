<!DOCTYPE html>
<html lang="it">

{{ head }}

<body class="no-print">

{{ header }}

<nav aria-label="breadcrumb" class="breadcrumb">Ti trovi in:
    <ol>
        <li><a href="/index.php" lang="it">Home</a></li>
        <li><a href="/prodotti.php" lang="it">Prodotti</a></li>
        <li aria-current="page">{{ shortName }}</li>
    </ol>
</nav>

<main>
    <h1>{{ shortName }}</h1>

    <div id="product-container" class="flex-container">
        <div class="main-content">

            <div id="product-image">
                {{ image }}
            </div>
            <div id="product-details">
                <h2>{{ name }}</h2>
                <p id="product-price">{{ price }}</p>
                <div class="cart-actions">
                    <input type="number" id="qty-input" name="quantity" value="1" min="1" max="50" style="width: 100px; text-align: center;">
                    <button type="button" id="add-to-cart">Aggiungi al carrello</button>
                </div>
                <p><strong>Produttore:</strong> {{ manufacturer }}</p>
                <p><strong>Disponibilità:</strong> {{ availability }}</p>
                <p>{{ description }}</p>
                <p>{{ type }}</p>
                <p><strong>Codice:</strong> {{ code }}</p>
            </div>
        </div>
    </div>
</main>

{{ footer }}

</body>
</html>
